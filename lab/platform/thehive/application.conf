## TheHive 5 — embedded single-node config for the lab (ADR-0006, decision 5).
## Local BerkeleyDB storage + local Lucene index: no Cassandra, no Elasticsearch.
## Not for production or HA; correct for the disposable per-attendee VM.
## The application secret is passed on the command line (--secret), not here.

## Storage: JanusGraph on BerkeleyDB, index on Lucene (no Cassandra, no Elasticsearch).
db {
  provider = janusgraph
  janusgraph {
    storage {
      backend = berkeleyje
      directory = "/opt/thp/thehive/db"
    }
    index.search {
      backend = lucene
      directory = "/opt/thp/thehive/index"
    }
  }
}

## Attachment storage on the local filesystem.
storage {
  provider = localfs
  localfs.location = "/opt/thp/thehive/files"
}

## ---------------------------------------------------------------------------
## TheHive -> n8n seam (ADR-0004, gate G14). The n8n Webhook trigger listens at
## path `thehive-alert`.
##
## We deliberately do NOT use TheHive's own webhook notifier. That notifier is an
## Enterprise-licensed capability: under the trial/community license this lab runs
## on, TheHive accepts the notification config (endpoint + CaseCreated rule) but
## silently never delivers it — no HTTP request, no error in the logs. Verified on
## TheHive 5.7.5 with the fallback "platinum trial" license (capabilities: []).
##
## Instead, the Wazuh->TheHive integrator (integrations/custom-w2thive.py) POSTs to
## the n8n webhook itself, immediately after it creates each case. That path is
## license-independent, fully in our control, and fires exactly once per case. The
## payload mirrors TheHive's native case webhook, so the n8n workflow is identical
## either way. See notify_n8n() in custom-w2thive.py.
## ---------------------------------------------------------------------------

## Service defaults.
play.http.parser.maxDiskBuffer = 50MB
play.http.parser.maxMemoryBuffer = 10MB
