# Dev overlay — live code, no rebuild.
#
# Bind-mounts each service's source over /app and runs the Flask apps under
# `gunicorn --reload`, so editing app.py (or the attack scripts) shows up on the next
# request without `docker compose build`. Opt-in only; the attendee VM image runs the
# plain compose file with the baked images and never sees this.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   # or just:  ./scripts/dev.sh
#
# soc-noise is a batch loop, not a server, so --reload does not apply; its source is
# mounted too, so `docker compose ... restart soc-noise` re-runs new code without a build.

services:
  bank-web:
    volumes:
      - ./services/bank-web:/app
    command:
      - gunicorn
      - --workers=1
      - --reload
      - --bind=0.0.0.0:8080
      - --access-logfile=/dev/null
      - app:app

  range-control:
    volumes:
      - ./services/range-control:/app
    command:
      - gunicorn
      - --workers=2
      - --reload
      - --timeout=90
      - --bind=0.0.0.0:8000
      - app:app

  soc-noise:
    volumes:
      # gen.py only, not the whole dir: the base compose mounts files inside /app
      # (threat-intel, wazuh-template.json), and a whole-dir mount would shadow them and
      # leave empty mount-point stubs in the source tree. soc-noise needs a restart to pick
      # up changes anyway, so a single-file mount is enough.
      - ./services/soc-noise/gen.py:/app/gen.py
